services:
  postgres:
    image: postgres:16-alpine
    container_name: gomgoods-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gomgoods
      POSTGRES_USER: gomgoods
      POSTGRES_PASSWORD: gomgoods
    ports:
      - "5432:5432"
    volumes:
      - gomgoods_postgres_data:/var/lib/postgresql/data

volumes:
  gomgoods_postgres_data:
